

<div class="card">
  <a href="{{ item.url }}" target="_blank" class="stretched-link card-link" aria-label="{{ item.title|striptags }} — {{ _('Continue lendo') }}">

    {% if item.image_url %}
        
        <img src="{{ item.image_url }}" class="card-img-top" alt="{{ item.title }}">
        
    {% else %}
        <img src="../../static/img/img-post-blog-scielo-exemplo.jpg" class="card-img-top" alt="{{ item.title }}">
    {% endif %}
    
    <div class="card-body">

        <div class="h6 card-subtitle mb-1">{{ item.publication_date|datetimefilter }}</div>
        
        <h3 class="card-title text-primary h6 fs-6 fw-bold lh-base d-inline m-0">
          {{ item.title }}
        </h3>
        <p class="card-text mt-2">
          {{ item.description|striptags|replace('Read More →', '')|truncate(70) }}
        </p>

        
    </div>
    <div class="card-footer">
      <span class="btn btn-secondary d-block mx-0 my-0 w-100" aria-hidden="true">{% trans%}Continue lendo{% endtrans %}</span>
    </div>
  </a>
  
</div>
