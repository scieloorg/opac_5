{{ form.hidden_tag() if form.hidden_tag }}
{% for f in form if f.type != 'CSRFTokenField' %}
  <div class="form-group {% if f.errors %}has-danger{% endif %}">
    <label for="{{ f.id }}" class="col-form-label">{{ f.label }}</label>
    {{ f(class="form-control" + (" is-invalid" if f.errors else "")) }}
    {% if f.errors %}
      {% for e in f.errors %}
        <div class="invalid-feedback d-block">{{ e }}</div>
      {% endfor %}
    {% endif %}
  </div>
{% endfor %}
